<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Ekle</title>
  <link rel="stylesheet" href="2416501043.css">
</head>
<body>
  <header>
    <h1>Etkinlik Ekle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <p>Yıldız (*) işaretli alanlar zorunludur. Bu sprintte form verileri kaydedilmez; sonuç aşağıda gösterilir.</p>
    <form id="etkinlik-formu" data-mode="ekle" novalidate>
      <div class="form-alani">
        <label for="ad">Etkinlik Adı *</label>
        <input type="text" id="ad" name="ad" minlength="3" required aria-describedby="ad-hata">
        <small id="ad-hata" class="alan-hatasi"></small>
      </div>

      <div class="form-alani">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori" required aria-describedby="kategori-hata">
          <option value="" selected>Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
          <option value="Yarışma">Yarışma</option>
          <option value="Konferans">Konferans</option>
          <option value="Sosyal">Sosyal</option>
        </select>
        <small id="kategori-hata" class="alan-hatasi"></small>
      </div>

      <div class="form-alani">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih" required aria-describedby="tarih-hata">
        <small id="tarih-hata" class="alan-hatasi"></small>
      </div>

      <div class="form-alani">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat" required aria-describedby="saat-hata">
        <small id="saat-hata" class="alan-hatasi"></small>
      </div>

      <div class="form-alani">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer" required aria-describedby="yer-hata">
        <small id="yer-hata" class="alan-hatasi"></small>
      </div>

      <div class="form-alani">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan" min="1" max="1000" aria-describedby="kontenjan-hata">
        <small id="kontenjan-hata" class="alan-hatasi"></small>
      </div>

      <div class="form-alani">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="5"></textarea>
      </div>

      <button type="submit">Kaydet</button>
    </form>
    <div id="form-mesaj" aria-live="polite"></div>
  </main>

  <footer>
    <p>Eyüp Başelçin 2416501043</p>
  </footer>
  <script type="module" src="event-form.js"></script>
</body>
</html>
